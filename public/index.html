<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CardClub 3</title><style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,Arial;color:#f6f2df;background:radial-gradient(ellipse at top,#14543f,#071c17 80%);min-height:100vh}header{padding:22px 5%;border-bottom:1px solid #ffffff20;display:flex;justify-content:space-between;gap:10px;align-items:center}h1{margin:0;color:#f7d57d}small,.muted{color:#bbcec3}.wrap{max-width:1050px;margin:30px auto;padding:0 16px}.panel{background:#0b3028;border:1px solid #ffffff30;border-radius:22px;padding:24px;margin-bottom:16px;box-shadow:0 12px 35px #0003}.games{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.game{background:#174639;border:2px solid transparent;text-align:left;color:white;font-size:18px}.game.active{border-color:#f5d176}.game span{font-size:36px;display:block}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}button{cursor:pointer;background:#f4cd6e;color:#112a20;border:0;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:750}button.secondary{background:#28634f;color:white}button.danger{background:#af4444;color:white}input{background:#071e19;color:white;border:1px solid #7b9c8e;border-radius:12px;padding:13px;font-size:16px;max-width:300px;width:100%}.hidden{display:none!important}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:16px 0}.player{padding:14px;background:#10372c;border:1px solid #ffffff25;border-radius:14px}.player.turn{border:2px solid #f4cd6e}.table{min-height:200px;background:radial-gradient(ellipse,#207956,#0c4934);border:9px solid #77502a;border-radius:80px;margin:18px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}.cards{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;min-height:85px}.card{width:59px;height:83px;border-radius:9px;background:#fff8e9;color:#111;display:grid;place-items:center;font-size:22px;font-weight:800;box-shadow:1px 3px 7px #0005}.card.red{color:#bf2e32}.card.click{cursor:pointer}.card.click:hover{transform:translateY(-8px)}.status{color:#f6d57c;text-align:center;margin:14px 0}#error{color:#ffb4a6}@media(max-width:650px){.games{grid-template-columns:1fr}.game{padding:10px}.game span{display:inline;font-size:25px;margin-right:8px}.panel{padding:15px}.card{width:47px;height:67px;font-size:18px}header small{font-size:11px}}
</style></head><body><header><h1>♠ CardClub 3</h1><small>Teen Patti · Kali Teedi · Kachuful</small></header><main class="wrap"><section id="home" class="panel"><h2>Choose your game</h2><p class="muted">Play with computer opponents or invite friends with a private room code. Virtual chips only.</p><div class="games"><button class="game active" data-game="teen"><span>🃏</span>Teen Patti</button><button class="game" data-game="kali"><span>♠</span>Kali Teedi</button><button class="game" data-game="kachu"><span>🏆</span>Kachuful</button></div><p><input id="name" placeholder="Your name" maxlength="20" value="Player 1"></p><div class="row"><button id="create">Create room</button><input id="codeInput" placeholder="Room code" maxlength="5"><button id="join" class="secondary">Join room</button></div><p id="error"></p></section><section id="gameArea" class="hidden"><div class="row"><h2 id="gameTitle"></h2><strong id="roomCode"></strong></div><div id="lobby" class="panel hidden"><h3>Waiting room</h3><p>Share the room code with friends, or add computer players.</p><button id="addBot" class="secondary">+ Add computer</button><button id="start">Start game</button></div><div class="players" id="players"></div><div class="table"><h3 id="info"></h3><div id="tableCards" class="cards"></div></div><div class="panel"><div id="message" class="status"></div><h3>Your cards</h3><div id="hand" class="cards"></div><div id="controls" class="row" style="justify-content:center;margin-top:18px"></div></div></section></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),$=id=>document.getElementById(id);let game='teen';document.querySelectorAll('.game').forEach(b=>b.onclick=()=>{game=b.dataset.game;document.querySelectorAll('.game').forEach(x=>x.classList.toggle('active',x===b))});$('create').onclick=()=>socket.emit('create',{name:$('name').value,game});$('join').onclick=()=>socket.emit('join',{name:$('name').value,code:$('codeInput').value});$('addBot').onclick=()=>socket.emit('addBot');$('start').onclick=()=>socket.emit('start');socket.on('errorMsg',m=>$('error').textContent=m);function act(type,extra={}){socket.emit('action',{type,...extra})}function button(text,fn,cls=''){const b=document.createElement('button');b.textContent=text;b.className=cls;b.onclick=fn;return b}function card(c,play){const d=document.createElement('div');d.className='card '+('♥♦'.includes(c.s)?'red ':'')+(play?'click':'');d.textContent=c.r+c.s;if(play)d.onclick=()=>act('play',{card:c.id});return d}function escapeHTML(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
socket.on('state',s=>{$('home').classList.add('hidden');$('gameArea').classList.remove('hidden');$('gameTitle').textContent={teen:'🃏 Teen Patti',kali:'♠ Kali Teedi',kachu:'🏆 Kachuful'}[s.game];$('roomCode').textContent='Room: '+s.code;$('lobby').classList.toggle('hidden',s.phase!=='lobby');$('start').style.display=s.players[0]?.id===s.me?'':'none';$('players').replaceChildren();s.players.forEach((p,i)=>{const d=document.createElement('div');d.className='player '+(s.turn===i&&s.phase!=='lobby'?'turn':'');d.innerHTML='<strong>'+escapeHTML(p.name)+'</strong> '+(p.bot?'🤖':'👤')+(p.id===s.me?' (You)':'')+'<div class="muted">'+(s.game==='teen'?'🪙 '+p.chips+' · '+(p.folded?'Packed':p.seen?'Seen':'Blind'):'Score '+p.score+' · Tricks '+p.wins+(p.bid!==null?' · Bid '+p.bid:''))+'</div><small>'+p.count+' cards</small>';$('players').append(d)});$('info').textContent=s.game==='teen'?'Pot: 🪙 '+s.pot:'Trump: '+s.trump;$('tableCards').replaceChildren();s.table.forEach(x=>$('tableCards').append(card(x.card,false)));$('message').textContent=s.message+(s.phase==='playing'||s.phase==='bidding'?' · Turn: '+s.players[s.turn]?.name:'');const me=s.players.find(p=>p.id===s.me),myTurn=s.players[s.turn]?.id===s.me;$('hand').replaceChildren();for(const c of me?.hand||[])$('hand').append(card(c,myTurn&&s.phase==='playing'&&s.game!=='teen'));$('controls').replaceChildren();if(s.phase==='finished'){$('controls').append(button('Play another round',()=>socket.emit('start')));return}if(!myTurn)return;if(s.phase==='bidding'){for(let i=0;i<=me.count;i++)$('controls').append(button('Bid '+i,()=>act('bid',{value:i})));return}if(s.game==='teen'&&s.phase==='playing'){$('controls').append(button('See cards',()=>act('seen'),'secondary'),button('Chaal '+(me.seen?20:10),()=>act('chaal')),button('Pack',()=>act('pack'),'danger'));if(s.players.filter(p=>!p.folded).length===2)$('controls').append(button('Show',()=>act('show')))}else if(s.phase==='playing')$('controls').textContent='Tap a card to play. Follow the lead suit when possible.'});
</script></body></html>
